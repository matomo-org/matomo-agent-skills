interface:
  display_name: "Matomo Implementation"
  short_description: "Implement a scoped Matomo change minimally, verify it, and stop before commit for review"
  default_prompt: "Use $matomo-implementation to write the code for a Matomo change that is already scoped. Resolve the checkout root and settle the branch before editing, asking which checkout when a machine holds several. Stay on the branch already checked out when it was made for this change; otherwise start new work on its own branch, in each repository the change touches. Establish which repository owns a path before running any repository command against it, testing the parent's index first with git ls-files --stage plugins/<Plugin>, which answers three ways: a 160000 entry whose path is exactly plugins/<Plugin> means a submodule, recorded whether or not it is initialised, while a nested gitlink such as plugins/Morpheus/icons says nothing about who owns the directory above it, so match the path rather than grepping the recursive listing for a mode; ordinary file modes such as 100644 mean the parent repository owns the plugin, which is the usual case for a core plugin and prints one line per tracked file, so read the modes rather than the listing; and only empty output needs git -C <path> rev-parse --show-toplevel, to separate an ignored sibling clone reporting a path inside the plugin from an untracked directory reporting the checkout root. Do not lead with rev-parse, which answers plausibly rather than failing in most cases it gets wrong — walking up to the parent in a core plugin directory or for a present but uninitialised submodule, and reporting a path inside the plugin for an initialised one — while failing outright when a submodule directory is absent, a stop the parent index would have avoided. Resolve the branch to start from per repository with the shared tracked target dev branch behavior rather than a remote's recorded default: prefer the current branch's upstream when it is a remote *-dev branch, reading it with git -C <repo> rev-parse --abbrev-ref --symbolic-full-name @{upstream}, which exits nonzero when none is set and has answered rather than failed; otherwise pick from git -C <repo> branch -r --list '<remote>/*-dev' the branch this change targets rather than the newest, since a plugin remote commonly still carries 3.x-dev and 4.x-dev; and ask when neither can be inferred confidently. Establish the remote before using one: the upstream prints remote-qualified, so its first path segment names it, and upstream/5.x-dev means the remote is upstream rather than origin. With no upstream, git -C <repo> remote lists them, one remote is the answer, and with several ask which is canonical rather than defaulting to origin, since a fork checkout usually has origin pointing at the fork. Fetch and list against that same remote throughout. Do not substitute refs/remotes/<remote>/HEAD, which records whatever the remote calls default — possibly main while the change targets 5.x-dev — and which a plain fetch never refreshes. Then run git -C <repo> fetch <remote>, the remote resolved above, without which the remote-tracking ref is stale and the branch cuts from an older tip; fetching a different remote leaves the chosen base stale or absent. The resolved value is already remote-qualified, so pass it to git -C <repo> checkout -b <branch> <dev branch ref> unchanged, after checking with git -C <repo> branch --list <branch> that the branch does not already exist, since creating one that does fails rather than switching to it and the exit code is 0 whether or not it is there. Read the current branch and working tree with git -C <repo> rev-parse --abbrev-ref HEAD and git -C <repo> status --short before branching, where empty status output means git sees no modifications to tracked files and no unignored new ones, and a nonzero exit means something else — 128 for a path that is not a repository. Do not move a repository off its current branch without asking unless that branch was made for this change, committed and clean work included, and treat a detached HEAD, or any command in this sequence failing including the ownership probes, as a stop-and-ask rather than something to work around, noting that git -C <repo> rev-parse --abbrev-ref HEAD prints the literal HEAD rather than a name when detached. Keep a command that failed separate from one that succeeded with nothing to report, and treat three outcomes as needing handling of their own rather than reading as failure, the plain empty results described earlier being answers in their own right: @{upstream} exiting 128 with no upstream configured, which sends you to the *-dev candidate list; an empty candidate list, which means the remote-tracking refs were never fetched as often as it means nothing matched, so fetch and list again before asking; and grep exiting 1 for no match, where 2 is the failure. Report each repository, its branch, the ref it was cut from, and any branch you moved off. Establish the scope first: with an approved plan its file list and out-of-scope list are the contract, and without one state the scope in a line or two before the first edit so unrelated refactoring has something concrete to be measured against. Change only what the scope covers, follow the patterns already in the touched files and name the pattern followed, reuse an existing helper rather than writing a new one, introduce no new dependency, preserve backwards compatibility, and refactor or reformat nothing the scope does not require. Treat an empty search result as a reason to check the search rather than as evidence of absence: pass --no-ignore to anything walking plugins/ because Matomo gitignores its separately distributed plugins, read a separately distributed plugin's history inside its own repository with git -C, never read a region by slicing text — a fixed context count such as -A15 truncates, and a range ending on the first closing brace stops at the first nested block, so parse structured files and locate-then-read code instead — and resolve a name to its definition before asserting what the value holds. Write within the compatibility envelope governing the file: with an approved plan use the envelope it derived, and without one establish the PHP floor before writing syntax (the plugin's own declared floor when it has one, never the local interpreter) and, for a separately distributed plugin, its declared Matomo range before calling anything the plugin does not own, since a core helper that first shipped after that floor is a fatal error on older releases rather than a graceful degradation. Apply the routed Matomo skills for code quality, tests, API design, documentation, security, plugin architecture, i18n, migrations, deprecation, Twig, Vue, frontend direction, and CSS as the change indicates, and rebuild any tracked generated artifact alongside the source it comes from. Write a comment only when it says something the code cannot, match the surrounding comment density, and delete comments that restate the next line before reporting. Then verify: run the checks the change warrants using the routed command forms, report Ran and Not run as separate lists with a reason for anything not run, and verify from the state a fresh checkout or CI runner starts in rather than the state your shell is already in. Report faithfully — failing tests with their output, skipped steps as skipped — and ground each claim on something checked in this session rather than recalled, whether a path, a line reference, a value, or a command's result, marking as unchecked anything you could not confirm. Stop before committing: leave the change in the working tree, describe what is there, and make a commit only when it is asked for separately and the message has been shown. For producing the plan before any code exists, prefer $matomo-implementation-planning; for cleanup review of a working diff, prefer $matomo-debt-check; for review of finished work, prefer $matomo-review."
