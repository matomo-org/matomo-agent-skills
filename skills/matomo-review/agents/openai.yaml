s what it costs: a run that reports less in order to agree with an imagined other run is worse, not more reliable, since reproducibility is owed by the mechanical layer and coverage honesty by the search layer. Enumerate in a fixed order anyway by walking paths in git diff --name-only order and lenses in the order above, and apply the same bar to every candidate instead of reporting whichever issue surfaced first; fixed order does not make the search reproducible but it stops presentation order from adding variance of its own. Give every finding a stable anchor of path, approximate line, and the rule or contract at issue; the anchor identifies a finding across runs while the sequential number is presentation order within one run only. Fixes the author already applied are part of the current diff and get reviewed as ordinary changed code, which is what catches defects a fix introduced. Only when this session or the user actually supplies earlier findings, add a Prior Findings section after Findings that accounts for each of them as resolved, unresolved, or withdrawn, matched by anchor rather than by number, reports a defect that survived a partial fix as unresolved rather than as a new finding, and still accompanies the complete review rather than replacing it. For an adversarial or exhaustive find-every-flaw request, or to review a change in order to learn from it, layer $matomo-adversarial-review on top of this review rather than replacing it, since it adds depth and the full written record rather than a different shipping decision, and is where the observations this skill drops and the per-path coverage ledger it withholds are written down; for narrow in-development cleanup review of the current diff, prefer $matomo-debt-check."
