interface:
  display_name: "Matomo Review"
  short_description: "Review Matomo diffs with a lens fan-out and evidence probes, reporting only what must be acted on before shipping"
  default_prompt: "Use $matomo-review to review a Matomo branch, PR, or explicit git range against the right baseline. When the user does not provide a base, resolve it to the tracked target dev branch: prefer the current branch's upstream when it is a remote *-dev branch, otherwise use the remote *-dev branch the current work targets, and ask the user if that base cannot be inferred confidently. Pin the target before reading anything: resolve base and head to concrete SHAs with git rev-parse, state both in the review header, and use those SHAs for every later command so a branch that moves mid-review does not move the target. When the base is a tracked dev branch rather than a revspec the user supplied, pin it to git merge-base of base and head rather than to the branch tip, and confirm with git merge-base --is-ancestor base head: when that check fails the tracked branch has advanced past the branch point, its tip contains commits the author never saw, and naming that tip as the base both describes a range the review did not read and makes a two-dot git log from it report the wrong commits, so record the tip separately if it is worth noting but never as Base. The review target is always committed history; check git status --porcelain first and treat uncommitted changes as excluded from the target and never as a finding, recording them once in the header as a precondition and noting in Overall Assessment that the assessed tree is head rather than what is on disk. Commit-history shape such as fixup commits awaiting autosquash belongs in Next Steps as mechanical pre-merge work, not in Findings. Assume CI is green: never run or recommend builds, test suites, UI tests, lint, or static analysis, and never discount confidence because they were not run, since the review's own evidence is read-only git and rg inspection. Matomo ships software to be used, so be exhaustive in coverage and selective in findings: every finding must name a plausible consequence for users, operators, security, data, or upgrades, ask for the smallest fix that makes the change safe to ship rather than a refactor or added generality, and prefer a shipped change plus a named follow-up when the impact is bounded and recoverable. Data integrity, upgrade correctness, and routed-skill requirements are floors that shipping speed does not lower. The output is a work list, so write only what somebody has to act on before the change ships: no bucket for observations that do not score, no per-path coverage ledger, no clean-result narration, and no restating of checks that found nothing, because an accounting nobody acts on costs the reader the attention the findings needed. Selectivity is an output filter applied after the search and never a smaller search, so run every check, lens, probe, and path verdict in full and then report only the part with a consequence; a review that looks at less in order to write less has broken this rule rather than followed it. Confidence limits are the exception and are always reported, since they change how far the verdict can be relied on: a path the review could not assess is written out, while a path it assessed and found sound is not. Security is the first priority and the one bar that never moves in either direction: neither the stance's selectivity nor the output filter applies to it, and its step in the severity derivation sits ahead of the step that drops observations, so no security-lens observation is ever dropped for looking too small to write down; report every finding the security and trust lens produces at the severity its impact warrants whether or not the consequence looks bounded, run that lens and the untrusted-input inventory on every review including diffs below the fan-out threshold, and report an unresolved security-relevant value as an ambiguity with the evidence that would settle it instead of assuming the safe reading. The security bar is identical in $matomo-adversarial-review; a security issue only an adversarial pass would catch means the coverage here is too weak and must be fixed here. This skill is also the shipping gate: its Verdict and Merge readiness are the authoritative answer on whether a change is safe to ship, no other skill raises or lowers that bar, and a merge-blocking defect found outside it is a gap in this skill or its routed rule sets rather than a reason for a stricter parallel review. A review has three layers that fail in different ways, so keep them separate. The mechanical layer answers questions with one correct answer reachable by a fixed command over the diff and must produce the same result on every run over the same target; the search layer is the lens fan-out, which is judgment over an open candidate space at a finite budget and will reach different deep defects on different runs; the adjudication layer scores what the other two found by running each candidate through the severity derivation, and is decidable in principle but only when applied by a context that did not produce the claim, since the finder has the lens's framing and its own effort in view and neither is a term in the derivation, which is why the same defect otherwise draws Medium on one run and Blocking on the next. Run the mechanical layer to completion first, before the fan-out, running all twelve of its checks in this order whether or not the diff looks like it needs them. Running all twelve is not negotiable; writing all twelve out is, so report by number only the checks that produced something the author has to act on and cover the rest with the 12/12 ran roll-up, which is a claim about work actually done rather than a formality. Every mechanical result must be identical across runs over the same target, so a mechanical miss shows up as a finding one run reports and the other does not rather than as two differently worded clean lines. The twelve are: routed doc-tag rules grepped over changed PHPDoc rather than read for, repository hygiene covering conflict markers and orig/rej leftovers and line-ending drift and mode-only changes and expected-screenshot PNGs outside Git LFS, submodule pointers with old and new commit, dependency lockstep between composer.json and composer.lock in both directions, version and migration pairing between added Updates/*.php and the plugin.json or core/Version.php marker in both directions, newly added PHPCS or PHPStan suppressions and baseline entries, deprecation surface covering added or removed @deprecated and public methods removed outside tests, framework sinks covering added |raw in Twig and v-html in Vue and SFC block order, translation files separating en.json from other locales, leftovers in added lines covering debug output and TODO/FIXME and commented-out blocks and absolute local paths, docblock continuation alignment where added PHPDoc continuation lines do not sit under their tag's description column, which must be computed by the awk command in references/review-checks.md over added lines only rather than judged by eye, and added docblocks in internal mode, enumerated by the second awk command in that file over every changed PHP file except API.php, which lists each prose-only docblock the diff added directly above a method; that command produces the candidate list and not the verdict, since a prose-only block carries no type information and so cannot rely on the missing-or-too-broad-native-types exception, leaving each candidate to be adjudicated against whether it conveys something the method name and signature do not, with test methods treated as internal mode like any other non-API.php method, where a candidate fails when its prose only restates the method name, its parameters or its return type, or repeats a statement already made in the class docblock or another docblock in the same file, and passes when the run can name the specific fact it conveys. Before judging the diff against any routed rule set, load that skill's SKILL.md and cite the specific rule when reporting a violation; a routed rule applied from recall is not evidence, so a rule set that was not read is unverified rather than clean. When git diff --shortstat shows more than 3 changed files or more than 150 changed lines, fan the first pass out into six lenses that each read the whole diff and report only inside their own mandate: security and trust, contracts and compatibility, correctness and data integrity, conventions and precedent, tests, and scope and repository hygiene. Dispatch them in parallel when the environment allows and sequentially otherwise, restating the mandate at the start of each sequential pass and never carrying the previous mandate into the next, then union the findings and assign a provisional severity at merge. Whether the fan-out gate opened is not output, since it follows from the target and two runs over the same range make the same choice, but how the fan-out then ran is: independent contexts and sequential passes are not equivalent instruments, since a sequential pass carries the previous mandate's framing and spends one attention budget across all six lenses, so a run that could not dispatch has a weaker search and says so in the Overall Assessment confidence statement. Severity assigned at merge is provisional, and the score that ships is the one a clean-context adjudication pass returns. After merging, build one packet per candidate and verify each in its own fresh context, concurrently, at a tier that follows the anchor's surface rather than the step it claims, since every verifier re-runs the derivation from step 1 and so must evaluate the floors whatever was claimed: a cheap model only when the claim is a routed-rule text match on a surface carrying no floor risk, such as a reused translation key, SFC block order, or a prohibited docblock tag, and otherwise the same model the review runs on, namely for any anchor touching security, access control, data or state handling, a declared contract, or upgrade and migration behavior, for any semantic test which is steps 2, 3 and 4, and for every step-5 drop, since the only drops verified are floor-adjacent and asking whether a consequence is genuinely absent there is the floor question in different words. Use the review tier when the surface is unclear, because guessing wrong downward is what the split exists to prevent: a cheap model applies a textual test about as well as an expensive one but does not reliably decide whether a caller can observe a dropped row, and cheapening that produces a verifier that under-applies the floors consistently, which is stable and wrong and looks entirely normal in the output. The packet carries the pinned range, the anchor, the claim as one falsifiable proposition about the code at head, the quoted evidence and the command that produced it, the claimed derivation step with its required quote, and a neutral one-sentence intent only when the claim depends on it. The packet must never carry which lens produced the finding, whether the review was adversarial, how the finding was reached or how much effort it took, any other finding or the number of findings, the run's Verdict or Merge readiness, or adjectives arguing for the conclusion, because each of those is a channel by which the finder's framing turns the second opinion into an echo of the first. The verifier reads the code at the anchor and, when step 1 is claimed, the routed skill's own rule text, then runs the derivation itself from step 1 rather than starting from the claimed step, and returns exactly one of: holds with the step number and the quote that step requires, at whatever severity that step gives; unproven with the specific evidence that would settle it; or false with what the code actually does, quoted. Raising is as ordinary an outcome as lowering, since a pass that only ever demotes is a discount rather than a check, and the verifier must not consider whether its answer blocks the merge or look for other defects, naming in one line but never investigating anything it happens to notice. Verify every observation that reached steps 1 through 4, and every step-5 drop whose surface could carry a floor, namely security, access control, data or state handling, a declared contract, or upgrade and migration behavior, since a dropped observation leaves no trace in the output and this is the only audit that a real blocker was not disposed of as no consequence found; verify nothing else, and never a mechanical check, since a second opinion on a grep result is waste. Return false only after reading the code and finding it does something other than the claim says; when unsure the code was read correctly that is unproven with the fact that would settle it, since false deletes a defect from the review while unproven sends it back for evidence, and uncertainty belongs on that side. On disagreement the verifier's step governs in both directions, and the finder may overrule only by quoting something the verifier demonstrably misread, either the step's own text or the code at the anchor, and then re-verifying with a corrected packet rather than substituting its own answer, once, after which the verifier's answer stands: a reviewer that can appeal without limit has not been checked, and one that cannot appeal a misread fact has handed a verifier a delete key. An unproven finding is not reported as stated: either obtain the named evidence and re-verify, or restate it as the ambiguity it is at the severity that applies if it holds, never quietly converting unproven into a drop. The three verdicts do not carry equal consequence, since a wrong holds costs little because the finding is still reported and the author reads the evidence, whereas a wrong false deletes a real defect and nothing downstream recovers it. A verdict is destructive when it removes a reported defect or lowers the gate, namely false, or holds at a step that demotes a floor-adjacent claim out of Blocking, and a destructive verdict never stands on one cheap verifier: corroborate it with a second independent verifier on the review tier or with the root reviewer re-reading the code at the anchor from the quote rather than from the finding's original reasoning, where corroboration must state what the code does at the anchor, quoted, since agreed is not corroboration and neither is restating the verdict. Where corroboration disagrees, the finding stands at the corroborating derivation's step, because a factual dispute between two contexts is a reason to keep a finding rather than to delete it. Confirming and raising need no corroboration, so only the verdicts that destroy something pay twice and they are a minority, which barely moves the cost; do not economize by cheapening the review tier or skipping corroboration, since the saving is a rounding error against the fan-out and both spend the pass's only product, which is a severity that holds across runs. Withdraw a corroborated false finding and re-examine any other finding that leaned on the same evidence. A drop the verifier scores at steps 1 through 4 stops being a drop and enters Findings at that step's severity with a number like any other finding, since the output filter keeps out observations with no consequence and the verifier has established that this is not one. A candidate raised into Blocking changes Merge readiness, which is derived from the verified bucket rather than from the provisional severities, and that is the pass working rather than a conflict to reconcile. Cost scales with the number of candidates rather than the size of the diff, so this is not a second fan-out and a review with a single finding still verifies it; never hand a verifier the full diff, the lens mandates, or the other packets. When the environment cannot run a separate context, run the pass as an explicitly separate sequential role that re-derives from the packet alone without the original reasoning in view and say in the Overall Assessment confidence statement that verification was self-administered; when it could not run at all, say that instead and do not report severities as though it had; say nothing about it when it ran normally. Report both degradations of the run's own machinery in one clause each and only when they happened, namely verification that was self-administered or could not run and a lens fan-out that ran sequentially rather than dispatched, since they are the same kind of limit over the two layers a reader would otherwise have no way to discount: degraded verification limits every severity in the review and a degraded fan-out limits its coverage, and a run reporting neither is claiming both ran. Run three evidence probes before judging the diff. The precedent probe looks up how the surrounding code already names and structures every new selector, translation key, method, prop, event, config key, or file, and records the file-and-example precedent or that none exists. The untrusted-input inventory lists every value newly read, forwarded, or trusted from a request parameter, header, cookie, session, upload, third-party response, or stored database content, and names the enforcement point for anything the diff treats as scope-limited; a limit that is only a convention among callers means the value is client-controllable. Each row also records the size bound that applies before the value is processed and the code enforcing it; a row whose answer is none is unfinished until it states what the newly added code does with an unbounded value of that shape and gives the cost as a complexity class rather than an impression, since work the diff adds ahead of validation is reachable on input the validator would have rejected and so is paid on requests that were never going to succeed. Tracing a value to its sink answers what it can reach and not what processing it triggers on the way, which is how a clean inventory gets reported over a value that is both unbounded and expensive. A row that comes back unbounded with a superlinear or unbounded cost is the client-reachable unbounded work floor and carries it into the derivation, since the row is the evidence that floor's qualifier asks for and a probe that produces one alongside a finding scored as bounded and recoverable is the same observation given two answers. Scope attribution attributes every changed path to the inferred intent, using git diff --submodule=short and git diff --summary so submodule pointer moves, generated assets, lockfiles, and mode changes cannot ride along unnoticed. Treat data loss or silent data drop, silent failure of a declared contract, trust-boundary gaps on client-controllable values, upgrade or rollback breakage, and client-reachable unbounded work as blocking by default, where the last of those is processing whose cost is unbounded by or superlinear in a value the client controls with no size bound enforced before the work runs, named with the value, the absent bound and the cost as a complexity class; availability is an impact class of its own, so that floor holds whether or not the same defect also touches confidentiality or privilege, and it is neither a disclosure nor a privilege gap is not a term in the derivation. Derive severity rather than judging it: record the observation with its anchor and consequence first, then take the first bucket that matches in this order — a routed skill rule literally prohibits or requires it, so Blocking with the rule quoted verbatim from the loaded SKILL.md rather than paraphrased into a requirement, and only when the rule text is binding such as do not, must, never, always or remove, since advisory text such as should, prefer, consider or where practical, and a rule scoped to a case the diff does not contain, do not reach this step and continue to be scored on consequence; it matches a severity floor, so Blocking, stating why the floor's own qualifier holds such as why the caller has no way to observe a silent drop, since behavior the code documents as deliberate can still match a floor but the documentation is evidence about the qualifier and must be answered rather than passed over; the security and trust lens produced it, so the severity its impact warrants with no downgrade for looking bounded; it names a plausible consequence that is bounded and recoverable in a follow-up, so Medium; it was observed but no consequence was found, or the consequence is that a future reader would have preferred a different shape, so it is not reported at all and is dropped from the output rather than given a place to live, since $matomo-adversarial-review is the skill that records and explains observations of that kind. Never decide a severity and reason backwards to a justification. Every observation lands in exactly one of Blocking, Medium, or dropped: a reported observation appears in Findings and nowhere else, a dropped one appears nowhere at all, no prose paragraph elsewhere carries a finding, and no section is invented to hold what the last step dropped. Dropping is for observations without a consequence and never for findings that are small, awkward to phrase, or unwelcome, so an observation that names a bounded consequence is reported however cheap its fix and a violation of a routed rule is never dropped: where a known exception takes such a violation out of Blocking it is reported as Medium, because it is still work the author has to do. Blocking is every observation reaching the first three steps and not the single most significant issue the run found, so a run that scores one blocking finding while several other observations matched a floor has applied the stance where the floors govern. Depth of investigation does not change severity: a defect found by measurement or by tracing into core scores the same as one visible in the diff, and the reverse. When applicability is uncertain, report it as a finding at the severity that applies if it holds together with the evidence that would settle it; uncertainty is a reason to report and never a reason to drop. Apply the routed Matomo rules for i18n, security, API development, plugin architecture, Twig, code quality, migrations, deprecation rules, Vue, documentation, and test expectations for their rules rather than their commands; missing coverage is still a finding, judged by reading the tests the diff adds. For migration reviews, treat a matching required version-marker bump for a newly added migration as expected execution wiring rather than a defect, flag missing or mismatched migration and version-marker pairs, flag version bumps without newly added migrations when no other explicit release-policy reason is present, and treat semantic changes to update files already present on the tracked target dev branch as blocking unless an allowed exception applies while non-semantic maintenance edits are not defects by themselves. Treat non-additive changes to existing posted public event parameters as compatibility findings routed through $matomo-deprecation-rules and blocking by default unless the diff clearly shows intentional major-version breakage. Output a Target header naming the base and head SHAs and the working-tree state, then findings using the Blocking and Medium buckets in that order with no third bucket, numbered sequentially across both, followed by Problem Addressed, Overall Assessment with Verdict and Merge readiness, which answer different questions and are derived independently: Verdict answers whether the change does what it set out to do judged against the intent inferred under Problem Addressed, so findings never lower it and a change that fully solves its problem while violating a routed rule is still Yes, whereas Merge readiness is mechanical and is Not ready whenever at least one verified Blocking finding exists and Ready otherwise, naming the findings it rests on as in Not ready (#1, #4) so the line says whether the gate is held by something dangerous or by a one-space indent, which is the Blocking bucket listed rather than a second severity judgment; then Matomo-Specific Checks, then Next Steps. Order findings within a bucket by the weight of the consequence they name, heaviest first, numbering them in that order and never ordering by lens, by discovery or by how the derivation reached the step, since a bucket holds observations that reached the same step rather than observations of the same size and a routed-rule docblock violation and a client-reachable exhaustion both reach Blocking. Next Steps follows the same order, heaviest consequence first, referencing findings by number, with mechanical pre-merge work that has no defect behind it named as such and placed last; it carries work and never a shipping verdict, so no step may state that the branch becomes mergeable once it is done, because that answers Merge readiness a second time in the place the reader acts on and by a rule this skill does not define. Keep it short: each finding is one to three sentences with its impact stated in one clause, Problem Addressed and Overall Assessment are one short paragraph each, and a change with nothing wrong in it produces a short review, which is the correct output rather than an under-delivered one. Nothing else goes in Findings, so an observation the derivation dropped is absent from the review rather than softened, parenthesised, appended to a neighbouring finding, or mentioned in passing in Overall Assessment, which carries the verdict's reasoning and its confidence limits rather than a narration of what the review did. Matomo-Specific Checks is a receipt rather than a report, in four lines, with exactly these labels and no others. Mechanical states that all twelve checks ran and names by number only those that produced a finding, pointing at it, as in 12/12 ran, #5 to finding #2, leaving clean and n/a checks covered by the count and neither listed nor explained. Check 12 is the single exception and also carries #12: n judged, m failing whenever it produced candidates, whether or not any of them failed, because it is the only check whose verdict is a judgment rather than a command's output and so the only one where the 12/12 roll-up is not self-evidencing; the count is what makes two runs comparable on it and what tells a skipped check apart from a candidate list adjudicated clean, and for that check it is the candidate list and its count rather than the per-candidate verdict that must be identical across runs. Rule sets lists the matched rule sets by name only, with all loaded when every one was read, and names any rule set that was not read as unverified — not loaded since that is a confidence limit, without per-rule-set bases, without rules cited for clean verdicts, and without the applied review dimensions or the lens fan-out, which are not output at all. Probes names the three evidence probes and confirms they ran, adding only what they returned beyond the findings above, normally nothing further, and naming an inapplicable probe as n/a, without reproducing the untrusted-input inventory rows, the precedent lookups, or the path attributions, which are working material whose consequential parts are already findings. Not verified lists any path the review could not assess with the reason, or None, and is the only place the coverage ledger surfaces. Never list the read-only commands the review ran, and never list build, test, lint, or static-analysis commands anywhere. The section list is closed: never add a section and never invent an appendix such as noted, excluded deliberately, deliberately not raised, open ambiguities, or a per-path coverage table, since those are exactly what this format removed. The coverage ledger is review work rather than review output: give every path in git diff --name-only a verdict in it, in that order, including submodule pointers, generated assets, lockfiles, expected-screenshot binaries and mode-only changes, each held with the rule sets and dimensions that covered it and exactly one verdict of sound with its basis, a finding number, n/a with a reason, or unreviewed with a reason, where a bare sound is not acceptable in the ledger either. Only two things escape the ledger into the output: paths whose verdict is a finding number, through Findings, and paths whose verdict is unreviewed, through Not verified and the Overall Assessment confidence statement. A review is complete when the ledger has a verdict for every path, not when findings stop appearing and not when it runs out of things worth writing down, and every clean verdict must rest on a specific claim about what was checked, held in the ledger rather than in the output, so a path called sound on nothing but the absence of an alarm is an unchecked path and the review must still be able to state the basis on request. Every run stands alone: never infer that a prior review happened, review the complete target diff rather than a delta, and never suppress a finding because it looks previously known or too obvious to repeat, since the reporting bar is the stance and the floors and nothing else. Runs are compared against different expectations per layer, and claiming more than this hides where a review actually varies. The mechanical check results, the internal coverage ledger's path list and the loaded rule sets must be identical across runs over the same target, whether or not the output writes them out. The severity of any observation both runs made must be stable, since it follows from the severity derivation rather than from how the observation was found or how much work it took to reach; the clean-context adjudication pass is the mechanism that makes this true rather than merely required, because two runs reaching the same defect build near-identical packets and a fresh context asked the same question returns the same step. Which deep defects the search layer reaches will differ, because a finite budget spent in different places produces a sample of the candidate space and never the whole of it. Never narrow the search to make runs match: a run that reports less in order to agree with an imagined other run is worse, not more reliable, since reproducibility is owed by the mechanical layer and coverage honesty by the search layer. Enumerate in a fixed order anyway by walking paths in git diff --name-only order and lenses in the order above, and apply the same bar to every candidate instead of reporting whichever issue surfaced first; fixed order does not make the search reproducible but it stops presentation order from adding variance of its own. Give every finding a stable anchor of path, approximate line, and the rule or contract at issue; the anchor identifies a finding across runs while the sequential number is presentation order within one run only. Fixes the author already applied are part of the current diff and get reviewed as ordinary changed code, which is what catches defects a fix introduced. Only when this session or the user actually supplies earlier findings, add a Prior Findings section after Findings that accounts for each of them as resolved, unresolved, or withdrawn, matched by anchor rather than by number, reports a defect that survived a partial fix as unresolved rather than as a new finding, and still accompanies the complete review rather than replacing it. For an adversarial or exhaustive find-every-flaw request, or to review a change in order to learn from it, layer $matomo-adversarial-review on top of this review rather than replacing it, since it adds depth and the full written record rather than a different shipping decision, and is where the observations this skill drops and the per-path coverage ledger it withholds are written down; for narrow in-development cleanup review of the current diff, prefer $matomo-debt-check."
