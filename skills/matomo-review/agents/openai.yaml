interface:
  display_name: "Matomo Review"
  short_description: "Review Matomo diffs with a lens fan-out and evidence probes, reporting only what must be acted on before the change reaches customers"
  default_prompt: "Use $matomo-review to review a Matomo branch, PR, or explicit git range against the right baseline. When the user does not provide a base, rank every candidate before collecting any diff: for each remote *-dev branch compute its merge-base with HEAD and the commit count from that merge-base to HEAD, then take the candidate with the fewest commits, which is the dev branch the work was cut from and whose count is the number of commits under review; a branch's own upstream is a candidate like any other and wins only if it ranks first, and the user is asked only when the smallest count is not unique. Never guess a *-dev branch and then read the diff to find out whether the guess was right: neighbouring Matomo dev branches differ by thousands of files, so a wrong guess produces a diff large enough to be read before anything reveals it was the wrong comparison, and a run that does not notice reviews it. Pin the target before reading anything: resolve base and head to concrete SHAs with git rev-parse, state both in the review header, and use those SHAs for every later command so a branch that moves mid-review does not move the target. When the base is a tracked dev branch rather than a revspec the user supplied, pin it to git merge-base of base and head rather than to the branch tip, and confirm with git merge-base --is-ancestor base head: when that check fails the tracked branch has advanced past the branch point, its tip contains commits the author never saw, and naming that tip as the base both describes a range the review did not read and makes a two-dot git log from it report the wrong commits, so record the tip separately if it is worth noting but never as Base. The review target is always committed history; check git status --porcelain first and treat uncommitted changes as excluded from the target and never as a finding, recording them once in the header as a precondition and noting in Overall Assessment that the assessed tree is head rather than what is on disk. Commit-history shape such as fixup commits awaiting autosquash belongs in Next Steps as mechanical pre-merge work, not in Findings. Assume CI is green: never run or recommend builds, test suites, UI tests, lint, or static analysis, and never discount confidence because they were not run, since the review's own evidence is read-only git and rg inspection. Matomo ships software to be used, so be exhaustive in coverage and selective in findings: every finding must name a plausible consequence for users, operators, security, data, or upgrades, and ask for the smallest fix that makes the change safe in a customer's hands rather than a refactor or added generality. Matomo releases every merge, so score each defect on what it does once released and never on how easily it could be fixed afterwards: a follow-up lands on code customers already have, keeps the defect away from nobody, and is not a mitigation the derivation can credit, so keeping a real defect out of Blocking is a decision to release it and is correct only when the consequence is one a customer can carry. Data integrity, upgrade correctness, and routed-skill requirements are floors that shipping speed does not lower. The output is a work list, so write only what somebody has to act on before the change ships: no bucket for observations that do not score, no per-path coverage ledger, no clean-result narration, and no restating of checks that found nothing, because an accounting nobody acts on costs the reader the attention the findings needed. Selectivity is an output filter applied after the search and never a smaller search, so run every check, lens, probe, and path verdict in full and then report only the part with a consequence; a review that looks at less in order to write less has broken this rule rather than followed it. Confidence limits are the exception and are always reported, since they change how far the verdict can be relied on: a path the review could not assess is written out, while a path it assessed and found sound is not. Security is the first priority and the one bar that never moves in either direction: neither the stance's selectivity nor the output filter applies to it, and its step in the severity derivation sits ahead of the step that drops observations, so no security-lens observation is ever dropped for looking too small to write down; report every finding the security and trust lens produces at the severity its impact warrants whether or not the consequence looks bounded, run that lens and the untrusted-input inventory on every review including diffs below the fan-out threshold, and report an unresolved security-relevant value as an ambiguity with the evidence that would settle it instead of assuming the safe reading. The security bar is identical in $matomo-adversarial-review; a security issue only an adversarial pass would catch means the coverage here is too weak and must be fixed here. This skill is also the shipping gate, and the gate is the release: its Verdict and Release readiness are the authoritative answer on whether a change is safe in a customer's hands, no other skill raises or lowers that bar, and a release-holding defect found outside it is a gap in this skill or its routed rule sets rather than a reason for a stricter parallel review. Merging and releasing are one event, so there is one gate and no window between them for a follow-up to land in, no good enough to merge and fix before the release, and no finding whose consequence arrives only at a later gate. Never sort findings into merge-relevant and release-relevant, in the output or in anything said about the review afterwards: that split invents a second, lower bar this skill does not define and everything sorted beneath it reaches customers unfixed regardless, so when asked which findings matter for the release the answer is all of them, with Release readiness naming the ones that hold it, Blocking holding the release, and Medium going out with the change when the author does not fix it first. A review has four layers that fail in different ways, so keep them separate. The mechanical layer answers questions with one correct answer reachable by a fixed command over the diff and must produce the same result on every run over the same target; the enumeration layer asks a fixed question list of every surface the change introduces or alters, and because which surfaces exist is decidable from the diff its row list is owed identically on every run while whether a row's obligations are met is judgment belonging to the lens that owns the class, so a miss there is a surface the enumeration failed to list rather than a candidate a run failed to think of; the search layer is the lens fan-out, which is judgment over an open candidate space at a finite budget and will reach different deep defects on different runs; the adjudication layer scores what the other three found by running each candidate through the severity derivation, and is decidable in principle but only when applied by a context that did not produce the claim, since the finder has the lens's framing and its own effort in view and neither is a term in the derivation, which is why the same defect otherwise draws Medium on one run and Blocking on the next. Run the mechanical layer to completion first, before the fan-out, running all nine of its checks in this order whether or not the diff looks like it needs them, and materialising in the same context the shared diff the lenses will read. That context also builds the surface inventory: one row per surface the change introduces or alters, in git diff --name-only order, written beside the shared diff as surfaces.md in the form class | path:line | identifier | owning lens, with the classes, the question each row carries, and the routed skill whose binding rule answers it held in references/surface-obligations.md and the enumeration commands in references/review-checks.md. AGENTS.md puts a rule class in this skill when its population is bounded in the diff, on the ground that every run then finds it, and bounded is not enumerated: a lens under a read budget reaches a bounded population by noticing it, which samples the same way the open space around it does. The classes are stored state, client-supplied parameters, public API methods, and named public artifacts such as segment, metric, event and config key names, and a surface a mechanical check already decides is not enumerated a second time. Give every lens the rows its mandate owns and require one verdict per row and question, met with the code that meets it, unmet as a finding, or unreviewed with the reason, since a row is not a candidate a lens may decline to consider once the enumeration has settled that it is in scope, and the floor allowance on the read budget covers reaching one. Enter every unmet obligation at the merge as a candidate, treat a met verdict on a floor-carrying class as the stated negative the step-5 audit already covers, and keep an unreviewed row as a ledger row rather than a dropped candidate. A run that could not build the inventory reports that with the other degradations of its own machinery, naming the classes left unenumerated. Running all nine is not negotiable; writing all nine out is, so report by number only the checks that produced something the author has to act on and cover the rest with the 9/9 ran roll-up, which is a claim about work actually done rather than a formality. A check earns its place only when nothing else in the repository already answers it, since one that cannot fire still counts toward the roll-up and one that fires on what CI would have held anyway spends the release gate on nothing: line-ending drift and expected-screenshot LFS storage are settled by .gitattributes at check-in, SFC block order is reported by .eslintrc.js during vue:build, lang/** edits are a diff-classification signal the changed-file list already carries, and phpcs decides PHPDoc continuation alignment and prose-only docblocks, so none of those are here. Every mechanical result and the inventory's row list must be identical across runs over the same target, so a mechanical miss shows up as a finding one run reports and the other does not rather than as two differently worded clean lines. The nine are: routed doc-tag rules grepped over changed PHPDoc rather than read for, repository hygiene covering conflict markers and mode-only changes and orig/rej leftovers the diff itself added, submodule pointers with old and new commit, dependency lockstep between composer.json and composer.lock in both directions, version and migration pairing between added Updates/*.php and the plugin.json or core/Version.php marker in both directions, newly added PHPCS or PHPStan suppressions and baseline entries, deprecation surface covering added or removed @deprecated and public methods removed outside tests, framework sinks covering added |raw in Twig and v-html in Vue, and leftovers in added lines covering debug output and TODO/FIXME and commented-out blocks and absolute local paths. Before judging the diff against any routed rule set, load that skill's SKILL.md and cite the specific rule when reporting a violation; a routed rule applied from recall is not evidence, so a rule set that was not read is unverified rather than clean. Set the fan-out width from git diff --shortstat: one pass at 3 or fewer changed files and 150 or fewer changed lines, three grouped lenses up to 500 changed lines, six above that, with the security and trust lens dispatched on its own at every width. The six mandates are security and trust, contracts and compatibility, correctness and data integrity, conventions and precedent, tests, and scope and repository hygiene; at three-lens width group correctness with contracts, and conventions with tests and scope, each grouped lens carrying both mandates in full and reporting under each separately. Give every lens the shared-diff paths rather than the pinned range, and a read budget beyond them of 25 tool calls for the security-and-trust and correctness-and-data-integrity mandates and 15 for the rest, since those two carry the floors and a floor question takes several hops to pose at all; a lens may pass its budget to reach or to settle a Severity Floor question or to finish the evidence for a finding it has already named, saying so in its return, and at the budget it records the paths it wanted to read next as coverage rows. Each lens writes its full record — the coverage rows for every path it applies to, with the basis for each sound verdict — to lens-<name>.md in the shared-diff directory, and returns only what the merge acts on: its findings with evidence, its unreviewed rows, the count of paths it gave a verdict, and the routed rule sets it read; an observation whose impact class is a Severity Floor comes back as a finding, and while a lens may resolve on the facts that the class does not apply, it may not grant that it applies and return the observation as anything other than a finding, since accepted residual risk, disclosed and therefore fine, or the README covers it are severity judgments of zero and disposing is scoring in the same way importing a higher severity is; the bases exist so a clean verdict can be stated on request, and a file holds them better than the orchestrator's context, which re-reads them on every later turn and otherwise never reads them at all. Dispatch them in parallel when the environment allows and sequentially otherwise, restating the mandate at the start of each sequential pass and never carrying the previous mandate into the next, then union the findings and assign a provisional severity at merge. A step-4 candidate earns a verification packet only when the merge can write its consequence as the packet's own falsifiable proposition; drop one whose consequence cannot be stated that way at step 5 there rather than paying a verifier to reach the same answer. Settle the step at the merge, assigning exactly one, and where a candidate's route to step 1 is a routed rule, name the inventory row the obligation came from, or which entry of the surface list the rule's subject matched where the observation has no row — matching none is a decision rather than a gap, the observation is not reported and becomes an obligation for implementation instead. Where a lens states a negative on one of the floor-carrying surfaces the step-5 audit names, the merge enters it as a candidate dropped at step 5 rather than as prose it read past: that audit is stationed at step 5 because that is where disposals were expected to happen, so a lens disposing upstream of it puts the only check on a lost blocker below the hole, and entering the negative there returns it to the audit's reach at the cost of a packet only for the classes that carry floors. Whether the fan-out gate opened is not output, since it follows from the target and two runs over the same range make the same choice, but how the fan-out then ran is: independent contexts and sequential passes are not equivalent instruments, since a sequential pass carries the previous mandate's framing and spends one attention budget across every mandate at once, so a run that could not dispatch has a weaker search and says so in the Overall Assessment confidence statement. Severity assigned at merge is provisional, and the score that ships is the one a clean-context adjudication pass returns. After merging, build one packet per candidate and verify each in its own fresh context, concurrently within each batch, at a tier that follows the anchor's surface rather than the step it claims, since every verifier re-runs the derivation from step 1 and so must evaluate the floors whatever was claimed: a cheap model only when the claim is a routed-rule text match on a surface carrying no floor risk, such as a reused translation key, SFC block order, or a prohibited docblock tag, and otherwise the same model the review runs on, namely for any anchor touching security, access control, data or state handling, a declared contract, or upgrade and migration behavior, for any semantic test which is steps 2, 3 and 4, and for every step-5 drop, since the only drops verified are floor-adjacent and asking whether a consequence is genuinely absent there is the floor question in different words. Use the review tier when the surface is unclear, because guessing wrong downward is what the split exists to prevent: a cheap model applies a textual test about as well as an expensive one but does not reliably decide whether a caller can observe a dropped row, and cheapening that produces a verifier that under-applies the floors consistently, which is stable and wrong and looks entirely normal in the output. The packet carries the pinned range, the tier decided from the anchor's surface, the anchor, the claim as one falsifiable proposition about the code at head, the quoted evidence and the command that produced it, the claimed derivation step with its required quote — naming for a step-1 route which entry of the surface list the rule's subject matched — and a neutral one-sentence intent only when the claim depends on it. Two of those are preconditions on dispatch rather than good practice, and a packet failing either is malformed and is not sent: Evidence quotes lines, since a list of files and things to look for in them means nobody checked the claim against the code and is how a claim simply wrong about the code comes back false; and Claimed step names exactly one step, since a packet offering the verifier a choice has skipped the merge's gate and the verifier decides the same question on less evidence and decides it downward. A quote carries only what the command that produced it showed, so where the claim rests on the quoted line's surroundings — the section it sits in, the enclosing class or method, the branch that reaches it — that command must be one whose output shows them; grep -n returns a line and nothing containing it, and a verbatim quote attributed to the wrong scope fails verification exactly like a fabricated one while costing more, because the quote makes the packet look checked. The packet must carry no sentence whose subject is the verifier's decision procedure, and the test is grammatical rather than lexical: a sentence telling the verifier how to decide rather than what the code does does not belong there whatever verb it uses, so judge whether, assess whether, weigh whether, consider carefully whether, score accordingly, a step-5 drop is an available answer, and decide whether this is really step 5 are one class, and enumerating them only invites the next synonym. Every such sentence points at the exit by naming a cheaper answer than the one claimed, and hands back the one decision the merge is better placed to make. The packet must never carry which lens produced the finding, whether the review was adversarial, how the finding was reached or how much effort it took, any other finding or the number of findings, the run's Verdict or Release readiness, or adjectives arguing for the conclusion, because each of those is a channel by which the finder's framing turns the second opinion into an echo of the first. The verifier reads the code at the anchor and, when step 1 is claimed, the routed skill's own rule text, then runs the derivation itself from step 1 rather than starting from the claimed step, and returns exactly one of: holds with the step number and the quote that step requires, at whatever severity that step gives; unproven with the specific evidence that would settle it; or false with what the code actually does, quoted. Raising is as ordinary an outcome as lowering, since a pass that only ever demotes is a discount rather than a check, and the verifier must not consider whether its answer holds the release or look for other defects, naming in one line but never investigating anything it happens to notice. Verify every observation that reached steps 1 through 4, and every step-5 drop whose surface could carry a floor, namely security, access control, data or state handling, a declared contract, or upgrade and migration behavior, since a dropped observation leaves no trace in the output and this is the only audit that a real blocker was not disposed of as no consequence found; verify nothing else, and never a mechanical check, since a second opinion on a grep result is waste. Return false only after reading the code and finding it does something other than the claim says; when unsure the code was read correctly that is unproven with the fact that would settle it, since false deletes a defect from the review while unproven sends it back for evidence, and uncertainty belongs on that side. On disagreement the verifier's step governs in both directions, and the finder may overrule only by quoting something the verifier demonstrably misread, either the step's own text or the code at the anchor, and then re-verifying with a corrected packet rather than substituting its own answer, once, after which the verifier's answer stands: a reviewer that can appeal without limit has not been checked, and one that cannot appeal a misread fact has handed a verifier a delete key. An unproven finding is not reported as stated: either obtain the named evidence and re-verify, or restate it as the ambiguity it is at the severity that applies if it holds, never quietly converting unproven into a drop. The three verdicts do not carry equal consequence, since a wrong holds costs little because the finding is still reported and the author reads the evidence, whereas a wrong false deletes a real defect and nothing downstream recovers it. A verdict is destructive when it removes a reported defect or lowers the gate, namely false, or holds at a step that demotes a floor-adjacent claim out of Blocking, and a destructive verdict never stands on one verifier whatever tier that verifier ran at, so a review-tier context demoting a Floor 1 claim to Medium is the case this rule is about rather than an exception to it: dispatch a second independent verifier on the review tier with the same packet and the first verdict's quote, allowing the root reviewer to re-read the anchor itself only where the anchor sits inside the diff and the re-read is one checkable hunk, and hold the verdict unapplied until corroboration returns so the finding keeps its provisional severity while it waits and a corroboration that never happens cannot silently lower the gate. Corroboration must state what the code does at the anchor, quoted, since agreed is not corroboration and neither is restating the verdict, and a destructive verdict the run applied without corroborating is reported in the Overall Assessment confidence statement, naming the finding it lowered. Where corroboration disagrees, the finding stands at the corroborating derivation's step, because a factual dispute between two contexts is a reason to keep a finding rather than to delete it. Confirming and raising need no corroboration, so only the verdicts that destroy something pay twice and they are a minority, which barely moves the cost; do not economize by cheapening the review tier or skipping corroboration, since the saving is a rounding error against the fan-out and both spend the pass's only product, which is a severity that holds across runs. Withdraw a corroborated false finding and re-examine any other finding that leaned on the same evidence. A drop the verifier scores at steps 1 through 4 stops being a drop and enters Findings at that step's severity with a number like any other finding, since the output filter keeps out observations with no consequence and the verifier has established that this is not one. A candidate raised into Blocking changes Release readiness, which is derived from the verified bucket rather than from the provisional severities, and that is the pass working rather than a conflict to reconcile. Cost scales with the number of candidates rather than the size of the diff, so this is not a second fan-out and a review with a single finding still verifies it; never hand a verifier the full diff or the lens mandates. Dispatch one clean context per packet and never group packets to save contexts, since a verifier that can see a second claim calibrates against the pair instead of applying the test; the two levers on the pass's cost are the merge's packet gate, which decides how many candidates arrive, and the tier, which decides what each costs. The tier prices the verifier and nothing else, so a cheap packet meets every precondition a review packet meets: what it buys is the model that reads the packet, not a lower bar for writing it. Before dispatching, read the written packets back and check across all of them that every Evidence block quotes at least one line and that none directs the verifier's decision, rewriting the failures or dropping their candidates rather than sending them thin; that is the merge reading its own output, it costs a fraction of one packet, and it is worth that because packets are written as one batch and a batch degrades toward its end — measured on a Matomo review, nineteen packets written in a single generation had the first sixteen quoting code and naming one step while the last three were reading lists directing the verifier's decision, with nothing distinguishing them but position. For the same reason split a batch of more than about ten into two dispatches rather than writing them all in one turn, which costs less than one packet and keeps every packet out of a generation's tail, and does not replace the check, since each half still has a tail. When the environment cannot run a separate context, run the pass as an explicitly separate sequential role that re-derives from the packet alone without the original reasoning in view and say in the Overall Assessment confidence statement that verification was self-administered; when it could not run at all, say that instead and do not report severities as though it had; say nothing about it when it ran normally. Report each degradation of the run's own machinery in one clause each and only when it happened, namely verification that was self-administered or could not run, a lens fan-out that ran sequentially rather than dispatched, and a destructive verdict applied without corroboration with the finding it lowered, since they are the same kind of limit over the two layers a reader would otherwise have no way to discount: degraded verification limits every severity in the review and a degraded fan-out limits its coverage, and a run reporting neither is claiming both ran. Run three evidence probes before judging the diff. The precedent probe looks up how the surrounding code already names and structures every new selector, translation key, method, prop, event, config key, or file, and records the file-and-example precedent or that none exists. The untrusted-input inventory lists every value newly read, forwarded, or trusted from a request parameter, header, cookie, session, upload, third-party response, or stored database content, and names the enforcement point for anything the diff treats as scope-limited; a limit that is only a convention among callers means the value is client-controllable. Each row also records the size bound that applies before the value is processed and the code enforcing it; a row whose answer is none is unfinished until it states what the newly added code does with an unbounded value of that shape and gives the cost as a complexity class rather than an impression, since work the diff adds ahead of validation is reachable on input the validator would have rejected and so is paid on requests that were never going to succeed. Tracing a value to its sink answers what it can reach and not what processing it triggers on the way, which is how a clean inventory gets reported over a value that is both unbounded and expensive. A row that comes back unbounded with a superlinear or unbounded cost is the client-reachable unbounded work floor and carries it into the derivation, since the row is the evidence that floor's qualifier asks for and a probe that produces one alongside a finding scored as bounded and recoverable is the same observation given two answers. Scope attribution attributes every changed path to the inferred intent, using git diff --submodule=short and git diff --summary so submodule pointer moves, generated assets, lockfiles, and mode changes cannot ride along unnoticed. Treat data loss or silent data drop, silent failure of a declared contract, trust-boundary gaps on client-controllable values, upgrade or rollback breakage, and client-reachable unbounded work as blocking by default, where the last of those is processing whose cost is unbounded by or superlinear in a value the client controls with no size bound enforced before the work runs, named with the value, the absent bound and the cost as a complexity class; availability is an impact class of its own, so that floor holds whether or not the same defect also touches confidentiality or privilege, and it is neither a disclosure nor a privilege gap is not a term in the derivation. The change disclosing the gap itself does not clear a floor: a comment, docblock, README section, or commit message naming the limitation and even naming the remedy is evidence the gap is deliberate rather than evidence it is absent, since the customer meets the code and not the note about the code, and well-documented code is where that reasoning is most available and least sound. Derive severity rather than judging it: record the observation with its anchor and consequence first, then take the first bucket that matches in this order — a routed skill rule literally prohibits or requires it and its subject is a surface this change introduces or alters, so Blocking with the rule quoted verbatim from the loaded SKILL.md rather than paraphrased into a requirement, and only when the rule text is binding such as do not, must, never, always or remove, since advisory text such as should, prefer, consider or where practical, and a rule scoped to a case the diff does not contain, do not reach this step and continue to be scored on consequence. A surface is what a caller, an operator or an upgrade meets — a public method's signature or documented contract, a posted event, a config or option key, a schema or stored-state shape, a segment or metric name, an exported component prop, a user-facing string — so a rule about one has a bounded population in the diff and every run finds it, whereas a binding routed rule about internal prose shape, the tightness of a new test's assertion, or the naming of an internal artifact has an unbounded population, is a sample rather than a finding, and is an obligation on the implementation instead of being reported here; the class keeps its standard, enforced before the code exists where the population is what the change writes. Next, it matches a severity floor, so Blocking, stating why the floor's own qualifier holds such as why the caller has no way to observe a silent drop, since behavior the code documents as deliberate can still match a floor but the documentation is evidence about the qualifier and must be answered rather than passed over; the security and trust lens produced it, so the severity its impact warrants with no downgrade for looking bounded; it names a plausible consequence that is one a customer can carry, bounded, observable to whoever hits it, and recoverable by them or by a later release, so Medium, judged on what the released code does to that customer rather than on how small the fix is or on whether an issue could be opened for it, since fixability is not a term in the derivation and every fix lands behind the release; it was observed but no consequence was found, or the consequence is that a future reader would have preferred a different shape, so it is not reported at all and is dropped from the output rather than given a place to live, since $matomo-adversarial-review is the skill that records and explains observations of that kind. Never decide a severity and reason backwards to a justification. Every observation lands in exactly one of Blocking, Medium, or dropped: a reported observation appears in Findings and nowhere else, a dropped one appears nowhere at all, no prose paragraph elsewhere carries a finding, and no section is invented to hold what the last step dropped. Dropping is for observations without a consequence and never for findings that are small, awkward to phrase, or unwelcome, so an observation that names a bounded consequence is reported however cheap its fix and a violation that reached step 1 is never dropped: where a known exception takes such a violation out of Blocking it is reported as Medium, because it is still work the author has to do. A routed-rule violation whose subject is not a changed surface never reached step 1 and is not reported at all, since reporting it would be reporting one arbitrary sample of an unbounded set. Blocking is every observation reaching the first three steps and not the single most significant issue the run found, so a run that scores one blocking finding while several other observations matched a floor has applied the stance where the floors govern. Depth of investigation does not change severity: a defect found by measurement or by tracing into core scores the same as one visible in the diff, and the reverse. When applicability is uncertain, report it as a finding at the severity that applies if it holds together with the evidence that would settle it; uncertainty is a reason to report and never a reason to drop. Apply the routed Matomo rules for i18n, security, API development, plugin architecture, Twig, code quality, migrations, deprecation rules, Vue, documentation, and test expectations for their rules rather than their commands; missing coverage is still a finding, judged by reading the tests the diff adds. For migration reviews, treat a matching required version-marker bump for a newly added migration as expected execution wiring rather than a defect, flag missing or mismatched migration and version-marker pairs, flag version bumps without newly added migrations when no other explicit release-policy reason is present, and treat semantic changes to update files already present on the tracked target dev branch as blocking unless an allowed exception applies while non-semantic maintenance edits are not defects by themselves. Treat non-additive changes to existing posted public event parameters as compatibility findings routed through $matomo-deprecation-rules and blocking by default unless the diff clearly shows intentional major-version breakage. Output a Target header naming the base and head SHAs and the working-tree state, then findings using the Blocking and Medium buckets in that order with no third bucket, numbered sequentially across both, followed by Problem Addressed, Overall Assessment with Verdict and Release readiness, which answer different questions and are derived independently: Verdict answers whether the change does what it set out to do judged against the intent inferred under Problem Addressed, so findings never lower it and a change that fully solves its problem while violating a routed rule is still Yes, which holds for a defect that makes the change fail on a population of installations too, since a defect already reported in Blocking is not also a reason to lower Verdict and Partially is for intent the diff leaves unimplemented, whereas Release readiness answers whether the change can go to customers exactly as it stands, which is also the merge answer since merging releases it and must never be split into two lines, and is mechanical: Not ready whenever at least one verified Blocking finding exists and Ready otherwise, naming the findings it rests on as in Not ready (#1, #4) so the line says whether the gate is held by something dangerous or by a one-space indent, which is the Blocking bucket listed rather than a second severity judgment; then Matomo-Specific Checks, then Next Steps. Order findings within a bucket by the weight of the consequence they name, heaviest first, numbering them in that order and never ordering by lens, by discovery or by how the derivation reached the step, since a bucket holds observations that reached the same step rather than observations of the same size and a routed-rule docblock violation and a client-reachable exhaustion both reach Blocking. Next Steps follows the same order, heaviest consequence first, referencing findings by number, with mechanical pre-merge work that has no defect behind it named as such and placed last; it carries work and never a shipping verdict, so no step may state that the branch becomes mergeable or releasable once it is done, because that answers Release readiness a second time in the place the reader acts on and by a rule this skill does not define. Keep it short: each finding is one to three sentences with its impact stated in one clause, Problem Addressed and Overall Assessment are one short paragraph each, and a change with nothing wrong in it produces a short review, which is the correct output rather than an under-delivered one. Nothing else goes in Findings, so an observation the derivation dropped is absent from the review rather than softened, parenthesised, appended to a neighbouring finding, or mentioned in passing in Overall Assessment, which carries the verdict's reasoning and its confidence limits rather than a narration of what the review did. Matomo-Specific Checks is a receipt rather than a report, in four lines, with exactly these labels and no others. Mechanical states that all nine checks ran and names by number only those that produced a finding, pointing at it, as in 9/9 ran, 11 surfaces, 2 unmet, #5 to finding #2, carrying the inventory's row and unmet counts on the same line because the enumeration is owed identically across runs and comparing two runs' counts is the cheapest way for a reader to see whether it was, and leaving clean and n/a checks covered by the count and neither listed nor explained. Rule sets lists the matched rule sets by name only, with all loaded, applied to changed surfaces when every one was read, the qualifier being load-bearing since step 1 applies a routed rule only where its subject is a surface the change alters, and names any rule set that was not read as unverified — not loaded since that is a confidence limit, without per-rule-set bases, without rules cited for clean verdicts, and without the applied review dimensions or the lens fan-out, which are not output at all. Probes names the three evidence probes and confirms they ran, adding only what they returned beyond the findings above, normally nothing further, and naming an inapplicable probe as n/a, without reproducing the untrusted-input inventory rows, the precedent lookups, or the path attributions, which are working material whose consequential parts are already findings. Not verified lists any path the review could not assess with the reason, or None, and is the only place the coverage ledger surfaces. Never list the read-only commands the review ran, and never list build, test, lint, or static-analysis commands anywhere. The section list is closed: never add a section and never invent an appendix such as noted, excluded deliberately, deliberately not raised, open ambiguities, or a per-path coverage table, since those are exactly what this format removed. The coverage ledger is review work rather than review output: give every path in git diff --name-only a verdict in it, in that order, including submodule pointers, generated assets, lockfiles, expected-screenshot binaries and mode-only changes, each held with the rule sets and dimensions that covered it and exactly one verdict of sound with its basis, a finding number, n/a with a reason, or unreviewed with a reason, where a bare sound is not acceptable in the ledg