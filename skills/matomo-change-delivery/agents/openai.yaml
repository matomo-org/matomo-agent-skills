interface:
  display_name: "Matomo Change Delivery"
  short_description: "Land finished Matomo work: version marker, changelog entry, commit message, and pull request body"
  default_prompt: "Use $matomo-change-delivery to land Matomo work that is already written and verified. Deliver only what was agreed; a commit is not the moment to add a fix or a tidy-up the change did not already contain. Decide the version marker separately for each repository the change touches, since a change spanning core and a plugin may need a bump in both, in one, or in neither, and qualify every path by repository because an unqualified plugin.json, CHANGELOG.md or template path reads core's copy whichever repository the change is in. Establish which repository owns the plugin before any marker or tag command, using the ownership test $matomo-implementation documents in its Branch Setup: skipping it gives a confident wrong answer rather than an error, since git -C plugins/Referrers tag walks up and returns core's tags as if they were the plugin's. A parent-owned plugin has no release marker of its own — it ships with core and plugins/Referrers carries no plugin.json at all — and core/Version.php is not to be bumped for ordinary work in a bundled plugin, since core's marker moves through the release process in its own commits and only migration work follows $matomo-migrations-workflow's core-marker rule. Only a separately distributed plugin has a release marker of its own, and its tag stream may be empty when nothing has shipped yet. For the legacy form the class is not reliably <Plugin>.php at the repository root, so find it on the branch with git -C <repo> grep -E -l 'function[[:space:]]+getInformation[[:space:]]*\\(' <remote>/<target branch> -- '*.php', matching the method rather than the substring since a plain function getInformation also matches getInformationalResults in plugins/Diagnostics/DiagnosticReport.php; it prints <ref>:<path>, so take the path after the first colon, discount a match on the framework base class core/Plugin.php which declares the method the legacy form overrides, treat empty output exiting 1 as the marker not being found and the decision unresolved rather than the plugin having no version, and ask when more than one file still matches. Read the whole method from the ref at that discovered path with git -C <repo> show <remote>/<target branch>:<discovered path> rather than slicing around the match, follow any constant or property the version entry reads from to wherever it is actually defined, whether the same file, a parent class, a trait or an imported class, reporting unresolved only once no concrete value can be established rather than because the definition sits elsewhere, and report the decision unresolved when no concrete version can be derived; that discovered path is then the marker path the history commands take; so only a separately distributed plugin, tracked as a gitlink like plugins/CustomAlerts or an ignored sibling clone, has a marker and tags to read. For one of those the marker is either version in plugin.json at the root of the plugin's own repository or getInformation() on the plugin class, mutually exclusive and paths relative to that repository, so with no plugins/<Plugin>/ prefix. Read the target branch rather than the working tree, which may already hold this change's own bump and would compare against itself: git -C <repo> fetch <remote> leaves the working tree, index and checked-out branch unchanged while updating remote-tracking refs, auto-followed tags and FETCH_HEAD, then git -C <repo> show <remote>/<target branch>:<marker path> gives the marker as the branch has it, and a failed fetch, an unknown remote or a ref that does not resolve is a stop rather than a reason to fall back to the local copy. To tell whether a bump already landed, list the marker's own history with git -C <repo> log <remote>/<target branch> --oneline -- <marker path> and read the change itself with git -C <repo> log -p <remote>/<target branch> -- <marker path> when it matters, since a subject does not establish that the version moved and a bump followed by a revert leaves it where it started; empty output answers about the range examined, not the whole history. Read the marker from the ref rather than from disk in both cases: git -C <repo> show <remote>/<target branch>:core/Version.php piped to grep for core, and git -C <repo> show <remote>/<target branch>:plugin.json piped into a JSON parse on stdin for a plugin, rather than opening the working-tree file, which may already hold this change's own bump; or the getInformation() declaration where an older plugin still uses it — the last two are mutually exclusive and a plugin carrying both raises an exception at load rather than preferring one. Bump the plugin version for a pull request that changes behaviour, not for CI-only or tooling-only work, and take the exception seriously: when a merged but unreleased pull request has already moved the version since the last release, add a line to that existing changelog entry instead of bumping again. Compare the target-branch version against what shipped: run git -C <repo> tag on its own first so a failure is visible before a filter hides it, then derive the target branch's version series and select stable releases only within it — 5.* for 5.x-dev but 5.11.* for a 5.11.x maintenance branch, which would otherwise be measured against 5.12.0, asking when the branch does not map onto a series clearly — and set aside -rc, -b, -alpha and -beta tags, which mark prereleases; some repositories carry several and others none at all. Do not filter by reachability instead: Matomo cuts release tags on release branches, so 5.12.0 is not an ancestor of 5.x-dev and --merged answers 5.0.3, confidently and wrongly. With no tag on the line at all, report the decision as unresolved. A version ahead of the newest stable tag on its line means a pending bump to extend, but only for a plain x.y.z marker. A prerelease marker settles nothing on its own and means different things per component: core carries a rolling -alpha through normal development, so 5.13.0-alpha permanently sits ahead of stable 5.12.0, while a plugin's -b or -rc can be a shipped beta or release candidate. Follow that component's release policy, never infer a pending bump from the suffix alone, and leave whether anything is recorded to the changelog rules on their own terms. No tags at all is three situations and settles none — never released, cloned without them, or an unfinished fetch — and cannot establish a pending bump, so for a first release ask rather than inventing a baseline. Sanity-check even a tag that exists, since a plugin declaring 5.2.6 whose newest tag is 0.1.0 has vestigial tags that answer nothing. Add a changelog entry only where the repository keeps a changelog, since roughly a third of plugins do not. There is no single plugin changelog format — among four plugins one uses * version - date - text, one the same with a leading dash, one a ### version heading above bullets, and one a bare version line above bullets — so read the target file and copy its structure, ordering, punctuation and date convention rather than importing a format. Write it for the person reading the release rather than the person who wrote the diff. Core's CHANGELOG.md is the developer changelog for HTTP API, plugin, theme and SDK changes, which is what the pull request checklist item about the developer changelog refers to, so an ordinary bug fix does not belong there. Write the commit message as a one-line imperative subject with a body only where the reason is not visible in the diff, never narrating the change file by file. Find the pull request template before writing the body, probing with test -f <repo>/pull_request_template.md and test -f <repo>/.github/pull_request_template.md, where status 0 with output means present, status 1 with no output means absent, and any other status means the probe itself failed: where it lives varies between repositories rather than by kind, some plugin repositories keep one at the root and others keep none, and a repository without one — matomo/matomo included — inherits the organisation default that matomo-org/.github holds at .github/pull_request_template.md. With no local copy and no network to fetch that default, stop and ask rather than reconstructing a template from memory. Reproduce every section and every checklist item, answer items with ✔, ✖ or NA and nothing else — the gate upper-cases before comparing, so na and Na pass too, while a checkbox clicked in the GitHub UI produces [x], which matomo-org/github-action-checklist-gate rejects as an unsupported status; ✖ and NA both pass, so answer honestly. Leave the two AI attestation items for the human author, which means the AI Checklist check fails until they are filled in and the pull request is deliberately incomplete, so open it as a draft with gh pr create --draft and let the author mark it ready with gh pr ready <number> once they have answered. That command reaches the network and needs an authenticated client, a configured remote and the head branch already pushed, so confirm the push landed first; when it fails no pull request was created, which is to be said plainly rather than described as submitted. Never answer them to make the check pass, never describe a draft as delivered, and hand it over naming the two attestations as the one outstanding action and saying the AI Checklist clears when they are answered. Never fill in a Review section. On a public repository lead the description with what changes for the people affected, keep the mechanism to a short second paragraph, and leave internal asides out. Show the commit message and the pull request body before creating either, since both are outward-facing and post under the author's account. Stage paths by name rather than staging everything, which sweeps in editor directories and caches that a status listing filtered for readability is exactly where to hide. Treat work spanning core and a separately distributed plugin as one delivery in several commits, putting the plugin's version bump and changelog line in the plugin's own repository alongside the code they describe, and saying which commit is in which repository. Expected files and screenshots living in a plugin repository need their own commit there and should already be in the handoff, since $matomo-implementation requires a tracked generated artifact to be rebuilt with its source; reach for $matomo-pr-autofix only when a pull request's checks call for syncing or repairing them. The parent may track a plugin as an ordinary directory, as a 160000 gitlink, or not at all when it is an ignored sibling clone, so use the ownership test from $matomo-implementation before committing, and treat moving a recorded gitlink as a separate decision belonging to the parent's own change. Before committing, confirm the marker is in the state intended — moved, deliberately unchanged because a bump is already pending, or not applicable — and read git -C <repo> diff --cached --name-only to confirm every path is one you meant, treating empty output as nothing staged, and a nonzero exit as the command having failed rather than answered — read what it printed, since a path that is not a repository, an unreadable index and a permissions failure all end that way. After pushing, compare git -C <repo> rev-parse HEAD against git -C <repo> ls-remote <remote> refs/heads/<branch>: matching SHAs are the confirmation, empty output means the branch is not on the remote, and a differing SHA means something else moved it. For the plan before code exists, prefer $matomo-implementation-planning; for writing the code, prefer $matomo-implementation; for review of the result, prefer $matomo-review; for failing checks once the pull request exists, prefer $matomo-pr-autofix."
