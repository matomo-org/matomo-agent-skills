interface:
  display_name: "Matomo Adversarial Review"
  short_description: "Adversarial Matomo review for learning and for finding what the regular review misses"
  default_prompt: "Use $matomo-adversarial-review to perform an adversarial, super-senior Matomo branch or PR review that layers on top of $matomo-review and inherits its target selection, review stance, lens fan-out, routed rule sets, review dimensions, severity policy and floors, evidence probes, coverage ledger, and inspection commands. Use the tracked target dev branch when no explicit base is provided. It does not inherit that skill's output discipline: $matomo-review withholds most of what it produces because its output is a work list, whereas this skill is read to learn and so writes down what the regular review dropped, which makes recording the non-scoring observations and the coverage ledger a deliverable here rather than an aside. This skill is not the shipping gate and not a higher quality bar: $matomo-review decides what is safe to put in a customer's hands, and since every merge is released that is the only gate either skill has, and this skill exists to teach the developer something, sharpen judgment about Matomo conventions, and find what the regular review would have missed so the review skills themselves can improve. Same bar, deeper search: take severity from the $matomo-review severity policy applied exactly as that skill would apply it, never escalate a finding because the review was adversarial, and report the verdict $matomo-review would reach rather than a stricter one. The clean-context adjudication pass runs here exactly as $matomo-review defines it, over the Blocking and Medium groups and over the floor-adjacent Noted entries but not over Consistency or Probes / Questions items, which carry a Judgment or an explicit unconfirmed label rather than a severity; it is also what makes the same-bar promise checkable, since the packet never says the review was adversarial and so an escalation this stance forbids comes back at the severity the derivation actually gives it. The per-finding Verification field, which names the check the author or CI should carry, is unrelated to that pass. The security bar is fixed and identical to $matomo-review, which already carries the highest security bar, so add no extra security strictness here. Always run the lens fan-out regardless of diff size, since depth inside each lens is the point. The fan-out supplies width, so add depth: push every changed behavior to its failure modes and work through hostile input, permission variants, upgrade and rollback states, and partial failures where the diff makes them plausible, treating depth as search effort rather than a raised bar. Every finding must be grounded in the diff, changed behavior, an existing Matomo contract, or a realistic runtime path, and must clear the review stance bar of a named consequence; findings that only teach belong in Noted, Consistency, or Probes / Questions, never in the severity buckets. Label a plausible but unconfirmed risk as a probe with the evidence that would settle it. Default to skepticism toward new patterns, abstractions, and code-style choices when an established Matomo convention or local precedent already covers the case, treat competing implementations of the same concept as a real maintenance cost, and never object without naming the smallest concrete convention-aligned alternative, reusing the file-and-example evidence the precedent probe produced. Give every finding Impact, Evidence, Reasoning, Fix, and Verification, where Verification names the check the author or CI should carry rather than something the review runs. Use the $matomo-review top-level sections in order, namely Findings, Problem Addressed, Overall Assessment, Matomo-Specific Checks and Next Steps plus Prior Findings when earlier findings were supplied, with the changes below. Under Findings, order the groups Blocking, Medium, Noted, Consistency, and Probes / Questions, writing None. for any empty group and keeping one shared sequential finding numbering across Blocking, Medium and Noted that Coverage rows cite. Noted is restored here rather than inherited: it holds every observation that reached the last step of the severity derivation, each with the same stable anchor as any other finding plus the reason it does not score, it gates nothing and affects neither Verdict nor Release readiness, and it is where maintainability-only observations go with a pointer to $matomo-debt-check; Consistency and Probes / Questions do not absorb it, but when an observation qualifies for Noted and for one of them, put it in the added group so its Judgment and Priority, or its confirming evidence, are not lost. Report convention divergence in the Consistency group with a Judgment of Conform, Needs author rationale, or Justified divergence plus a Priority. Matomo-Specific Checks is the expanded form here rather than the regular review's four-line receipt, with the labels Mechanical checks, Lens fan-out, Applied rule sets, Applied review dimensions, Structural integrity, Evidence probes, Adversarial review and Inspected: list all nine mechanical checks by name in the $matomo-review order with their result or n/a including the ones that found nothing, since the checks run unchanged because depth belongs to the search layer and the decidable layer has no depth to add; list the lenses; prefix each rule set with loaded or unverified — not loaded, citing at least one specific rule and the basis for any clean verdict; say exactly one of Clean., Findings listed above., or Not checked with a reason for Structural integrity; give each evidence probe with what it covered and what it returned or n/a, including the untrusted-input inventory's rows with each value's trust classification and the pre-processing size bound enforcing it, since those rows are the teaching material; and list under Inspected the read-only commands the review actually ran, including every mechanical-check command, never build, test, lint or static-analysis commands. Add a Coverage section immediately after Matomo-Specific Checks that emits the ledger $matomo-review builds and withholds, as a table with the columns Path, Applied and Verdict, one row per changed path in git diff --name-only order and covering every path including submodule pointers, generated assets, lockfiles, expected-screenshot binaries and mode-only changes, where Verdict is exactly one of sound with its basis, a finding number, n/a with a reason, or unreviewed with a reason and a bare sound is not acceptable; emit the table rather than a prose summary of it, because a path that is inconvenient to classify is exactly the kind that hides defects and showing the ledger is how a learning pass proves what it looked at. Add a Skill Gaps section immediately before Next Steps listing every finding the regular review would not have surfaced, each with the skill that needs the rule, the rule or check that was missing, and whether the gap is release-relevant or teaching-only, or stating that every finding above is reachable from the existing rules; that section is how adversarial passes pay back into the review skills. State in Overall Assessment that this was an adversarial review and summarize residual risk including whether unresolved Needs author rationale items affect confidence, and list Adversarial review alongside the routed rule sets in Matomo-Specific Checks."
