interface:
  display_name: "Matomo 6 Plugin Preparation"
  short_description: "Prepare a plugin's 6.x-dev branch: prep commit, CI and static-analysis updates, Vite Vue rebuild, screenshot sync, and verification against a Matomo 6 core"
  default_prompt: "Use $matomo-6-plugin-preparation to prepare a separately distributed plugin's 6.x-dev branch — the mechanical half of a Matomo 6 migration; code-level breaking-change work is out of scope and routes to $matomo-implementation-planning with the failing output as intake. The core team's prepare6x branches (plugin-LogViewer, plugin-QueuedTracking) are the reference implementations; check one before deviating. Work in the plugin's own repository per $matomo-implementation's Branch Setup, resolving the remote rather than assuming origin and fetching it before reading anything, creating 6.x-dev from the 5.x-dev tip when absent, and never assume an existing branch carries the prep commit: read the marker from the fetched ref with git show <remote>/6.x-dev:plugin.json rather than trusting the branch's existence. The prep commit follows the previous major's precedent (find it with git log --oneline --all -i --grep='prepare release for matomo'): plugin.json version 6.0.0 and require matomo >=6.0.0-b1,<7.0.0-b1 — the prepare6x convention, to be confirmed against a current prepare6x branch — plus a changelog heading matching the marker exactly in the file's own format with a Compatibility with Matomo 6 line. Rename an Updates file only when this same unreleased change introduced it and the marker version moved — released update files are immutable per $matomo-migrations-workflow: version_compare orders 6.0.0 above 6.0.0-b1, so a file named above the marker never runs; under the 6.0.0 convention the file is Updates/6.0.0.php containing class Updates_6_0_0. For CI, establish what matomo-org/github-action-tests provides today before editing — probe with gh api repos/matomo-org/github-action-tests/contents/action.yml --jq .content into a file (needs an authenticated gh client; a nonzero exit is the probe failing, not an answer), then read the resolved values rather than counting names with base64 -d piped to grep -A1 -E 'matomo6_(min|max)_php\\)' piped to grep -oE 'RESOLVED_VERSION=\"[0-9.]+\"': two lines with the min at 8.1 (the Matomo 6 floor; the max is a fleet policy value to read rather than assume) mean the aliases are usable, no output means absent, anything else is a partial or misconfigured state to inspect — and check whether reusable workflow_call workflows have replaced per-plugin workflow bodies, preferring a thin caller over patching a body when one exists. Bump the hardcoded php-version in phpstan.yml and phpcs.yml to 8.1 unconditionally, since their setup-php steps take the version directly and never pass through the central resolver. For matomo-tests.yml adopt the prepare6x shape, which is more than the PHP versions: PluginTests gains a database matrix (Mysql 8.0 and Mariadb 10.6 via mysql-engine/mysql-version inputs, upload-artifacts scoped to one cell), and the UI job gets node-version '24' plus explicit mysql-engine 'Mysql'/mysql-version '8.0' — a UI job failing with Unknown database 'piwik_tests' before any screenshot comparison means those environment inputs are missing, not that screenshots differ. With the aliases usable, swap every matomo5_min_php/matomo5_max_php for the matomo6_* counterpart including the UI job's php-version and the upload-artifacts condition string; with them absent, either land them in the central action first or use literal '8.1'/'8.5' as the prepare6x branches themselves do, since unrecognised values pass through the resolver unchanged. Leave minimum_required_matomo/maximum_supported_matomo alone: they resolve from plugin.json at run time, falling back tag then stable then 6.x-dev with a terminal 5.x-dev fallback only when the core repository lacks the major's dev branch — and verify the resolution from the test job's Testing against '<ref>' log line rather than trusting it, since 5.x-dev there means the run proved nothing about Matomo 6. Matomo 6 core bundles PHPStan 2 which fails hard on excludePaths entries absent from the current layout, so append the optional marker to the CI-only paths in the plugin's phpstan.neon (- vendor/ (?) and - github-action-tests/ (?)) and set phpVersion: 80100. When the plugin has vue/, rebuild vue/dist with the Vite toolchain — ddev npm install once in the Matomo 6 checkout then ddev matomo:console vue:build <Plugin> — committing the regenerated dist with the change and fixing the TypeScript errors the stricter 6.x toolchain surfaces rather than shipping them forward, since the build still emits with exit 0. Verify against a Matomo 6 environment only — a checkout whose core/Version.php reports 6.* with the plugin present — running the Integration and System suites (the config's [tests] http_host must point at this environment, not at whichever host a copied config names), previewing pending migrations with echo N | ddev matomo:console core:update since no --dry-run flag exists, executing with core:update --yes, re-testing the update path by resetting the version_<Plugin> option row and undoing the update's schema effects first, and running PHPStan via the mandated ddev composer phpstan -- --configuration plugins/<Plugin>/phpstan.neon plus phpcs with the plugin standard. UI screenshots differ wholesale against Matomo 6 (theme plus Node 24 headless Chrome) regardless of the plugin's changes: once a CI run's UI job has a working environment, sync with ddev matomo:console tests:sync-ui-screenshots <github run id> -r <org>/<plugin repo> --http-user/--http-password (premium artifacts are protected; the credentials are the builds-artifacts login), knowing the command writes into whichever checkout it runs in — confirm with git status that the sync landed where the commit will happen — and review the synced files before committing: theme and layout changes are expected, error pages and blank captures are regressions. Core carries no 6.0.0* tags until the first beta ships, so tag comparisons cannot confirm a first 6.x bump; the prep commit's bump is part of the change. Report what ran and what did not as separate lists, and suite failures referencing removed or changed core APIs signal code compatibility work this skill does not cover. Deliver through $matomo-change-delivery, with $matomo-migrations-workflow governing the version marker when a migration rides along."
