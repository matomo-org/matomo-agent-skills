interface:
  display_name: "Matomo 6 Plugin Preparation"
  short_description: "Prepare a plugin's 6.x-dev branch: prep commit, CI and static-analysis updates for Matomo 6, and verification against a Matomo 6 core"
  default_prompt: "Use $matomo-6-plugin-preparation to prepare a separately distributed plugin's 6.x-dev branch — the mechanical half of a Matomo 6 migration; code-level breaking-change work is out of scope and routes to $matomo-implementation-planning with the failing output as intake. Work in the plugin's own repository per $matomo-implementation's Branch Setup, creating 6.x-dev from the 5.x-dev tip when absent, and never assume an existing branch carries the prep commit: read the marker from the branch with git show origin/6.x-dev:plugin.json rather than trusting the branch's existence. The prep commit follows the previous major's precedent (find it with git log --oneline --all -i --grep='prepare release for matomo'): plugin.json version 6.0.0-b1 and require matomo >=6.0.0-b1,<7.0.0-b1 — beta versions during the Matomo 6 beta phase, the plugins-team convention as of August 2026, to be confirmed before applying — plus a changelog heading matching the marker exactly in the file's own format with a Compatibility with Matomo 6 line. Rename any pending Updates file to the marker's exact version: version_compare orders 6.0.0 above 6.0.0-b1, so Updates/6.0.0.php never runs on an update to 6.0.0-b1; the beta file is Updates/6.0.0-b1.php containing class Updates_6_0_0_b1. For CI, establish what matomo-org/github-action-tests provides today before editing — gh api repos/matomo-org/github-action-tests/contents/action.yml --jq .content | base64 -d | grep -c 'matomo6_min_php' (needs an authenticated gh client) tells whether the matomo6_min_php/matomo6_max_php aliases exist (8.1 and 8.5), and check whether reusable workflow_call workflows have replaced per-plugin workflow bodies, preferring a thin caller over patching a body when one exists. With aliases and no reusable test workflow, swap every matomo5_min_php/matomo5_max_php in .github/workflows/matomo-tests.yml for the matomo6_* counterpart including the UI job's php-version and the upload-artifacts condition string, and bump the hardcoded php-version in phpstan.yml and phpcs.yml to 8.1. Leave minimum_required_matomo/maximum_supported_matomo alone: they resolve from plugin.json at run time, falling back tag then stable then 6.x-dev, so most of the plumbing self-heals and only the PHP pins break. Matomo 6 core bundles PHPStan 2 where 5.x bundled 1.12, and PHPStan 2 fails hard on excludePaths entries absent from the current layout, so append the optional marker to the CI-only paths in the plugin's phpstan.neon (- vendor/ (?) and - github-action-tests/ (?)) and set phpVersion: 80100. Verify against a Matomo 6 environment only — a checkout whose core/Version.php reports 6.* with the plugin present — running the Integration and System suites (the config's [tests] http_host must point at this environment, not at whichever host a copied config names), previewing pending migrations with echo N | ddev matomo:console core:update since no --dry-run flag exists, executing with core:update --yes, and re-testing the update path by resetting the version_<Plugin> option row and undoing the update's schema effects first. Run PHPStan and PHPCS against the 6.x core before pushing, report what ran and what did not as separate lists, and expect UI screenshots to differ against the Matomo 6 UI regardless of the plugin's changes — regenerate them from CI artifacts rather than chasing diffs locally. Core carries no 6.0.0* tags until the first beta ships, so tag comparisons cannot confirm a first 6.x bump; the prep commit's bump is part of the change. Suite failures referencing removed or changed core APIs signal code compatibility work, which this skill does not cover. Deliver through $matomo-change-delivery, with $matomo-migrations-workflow governing the version marker when a migration rides along."
