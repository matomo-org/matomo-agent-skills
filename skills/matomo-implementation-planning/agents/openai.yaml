interface:
  display_name: "Matomo Implementation Planning"
  short_description: "Plan Matomo changes before coding with a derived version envelope and review-readiness mapping"
  default_prompt: "Use $matomo-implementation-planning to produce a Matomo implementation plan before writing any code. Resolve and record the Matomo checkout root first, asking the user which to use when a machine holds several, since separate checkouts sit at different versions. Read the context intake for module, current behavior, expected behavior, relevant files, and constraints, resolving missing fields from the checkout before asking and recording the rest as explicit assumptions. Treat any claim that something is absent as a claim to verify rather than a premise, and resolve a name to its definition before asserting what the value holds. Where the intake names a destination, system, or consumer, verify the chosen module actually reaches it before planning changes there, since a module that cannot reach the named destination is the wrong module however well the rest of the change fits; treat a risk that the change contradicts the module's documented purpose as evidence the module is wrong rather than a documentation gap to patch. Where the intake asserts a precedent exists and you cannot find it, treat that as a contradiction to resolve by widening the search or asking, not as an absent precedent to plan without. Pass --no-ignore to any rg search that walks plugins/, because Matomo gitignores its separately distributed plugins and a plugins-wide search otherwise returns nothing for exactly the plugins most likely to hold the precedent; naming an ignored plugin explicitly searches it, walking the parent does not. Derive the version envelope from the checkout every run rather than assuming it, preferring a plugin's own declared php and matomo requirements over the core floor when it declares them, and taking the tested PHP range for plugin work from that plugin's own .github/workflows/matomo-tests.yml rather than core's, since most separately distributed plugins ship their own matrix and it can differ sharply, and report the envelope in full only when the change actually depends on it. Classify the intended change and treat each matched rule set as an up-front planning requirement, applying the relevant Matomo skills for i18n, security, API development, plugin architecture, Twig, code quality, migrations, deprecation rules, Vue, CSS, frontend direction, documentation, and tests. Plan migrations with their version markers, translation keys with their reuse check, test types with their expected-file impact, tracked build artifacts with a rebuild in the same commit, privacy impact for new data, and archiving or log-table blast radius as part of the approach rather than as follow-up work. Find and cite an existing pattern or helper to reuse before proposing new code. Mark any step that happens outside the codebase as out-of-band, and list the out-of-band prerequisites under Verification with the failure mode for each, because the usual failure is a change that ships, looks correct, and silently has no effect. Emit the exact required sections in order: Context, Files likely to change, Existing patterns to look for, Proposed approach, Edge cases, Tests to add or update, Risks or assumptions, Review Readiness, Verification. Ground every factual claim in the plan on something checked in this session rather than recalled, and say so in place where something could not be checked, because a plan reads as verified fact and an unmarked guess inside one costs more than an acknowledged gap. State what is out of scope, restate unresolved assumptions as risks, and stop before implementing until the plan is approved. For review of work already written, prefer $matomo-review; for in-development cleanup review of the current diff, prefer $matomo-debt-check."
